name: Build and deploy Learn
on:
  push:
    branches: [main, 'verify/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: learn-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    outputs:
      pages_artifact: ${{ steps.artifact_name.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Capture dependency audit and lockfile
        run: |
          mkdir -p qa-dependencies
          cp package-lock.json qa-dependencies/package-lock.json
          node -e "const fs=require('node:fs');const s=fs.readFileSync('package-lock.json','utf8');for(const line of s.split('\\n')) console.log('LOCKFILE:'+line);"
          npm audit --json > qa-dependencies/npm-audit.json || true
          node -e "const a=require('./qa-dependencies/npm-audit.json'); console.log(JSON.stringify(a.metadata||a.error)); for(const [name,v] of Object.entries(a.vulnerabilities||{})) console.log(name,v.severity,JSON.stringify(v.fixAvailable));"
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ github.run_attempt }}
          path: qa-dependencies
      - run: npm run check:server
      - run: npm run check:network
      - run: npm run check:backend
      - run: npm run check:data
      - run: npm run check:data-exercises
      - run: npm run check:deep
      - run: npm run check:advanced
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Accessibility report
        if: always()
        run: npx playwright test --config playwright.accessibility.config.ts
      - name: Security gate
        run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-visual-audit-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
      - name: Choose unique Pages artifact name
        id: artifact_name
        run: echo "name=github-pages-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: dist
  cross-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run build
      - run: npx playwright install --with-deps firefox webkit
      - run: npx playwright test --config playwright.cross-browser.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-browser-qa-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, cross-browser]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: ${{ needs.build.outputs.pages_artifact }}
